<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EviTrace — Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 18px;
      font-weight: 700;
      color: #6ee7b7;
      letter-spacing: 2px;
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: #94a3b8;
    }

    .nav-user span { color: #e2e8f0; font-weight: 600; }

    .btn-logout {
      background: transparent;
      border: 1px solid #2d3148;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    /* MAIN */
    main { padding: 32px; max-width: 1200px; margin: 0 auto; }

    h2 {
      font-size: 20px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 24px;
    }

    /* STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 24px;
    }

    .stat-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #6ee7b7;
    }

    .stat-icon { font-size: 20px; margin-bottom: 8px; }

    /* CASES TABLE */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .btn-new {
      background: #6ee7b7;
      color: #0f1117;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-new:hover { background: #34d399; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 10px;
      overflow: hidden;
    }

    th {
      background: #12141f;
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    td {
      padding: 14px 16px;
      font-size: 13px;
      border-top: 1px solid #2d3148;
    }

    tr:hover td { background: #1e2235; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-open     { background: #1e3a5f; color: #60a5fa; }
    .badge-active   { background: #1a3a2a; color: #6ee7b7; }
    .badge-closed   { background: #2d2d2d; color: #94a3b8; }
    .badge-archived { background: #2d1f00; color: #f59e0b; }

    .btn-view {
      background: transparent;
      border: 1px solid #2d3148;
      color: #94a3b8;
      padding: 5px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .btn-view:hover {
      border-color: #6ee7b7;
      color: #6ee7b7;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 32px;
      width: 480px;
    }

    .modal h3 {
      font-size: 16px;
      margin-bottom: 24px;
      color: #6ee7b7;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 6px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #6ee7b7;
    }

    select option { background: #1a1d27; }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: flex-end;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid #2d3148;
      color: #94a3b8;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-submit {
      background: #6ee7b7;
      color: #0f1117;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }

    .empty-state {
      text-align: center;
      padding: 48px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">🔍 EVITRACE</div>
  <div class="nav-user">
    <span id="userName">Loading...</span>
    <span id="userRole" style="color:#6ee7b7; font-size:11px;"></span>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>
</nav>

<main>
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">📁</div>
      <div class="stat-label">Total Cases</div>
      <div class="stat-value" id="statCases">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔬</div>
      <div class="stat-label">Evidence Items</div>
      <div class="stat-value" id="statEvidence">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔁</div>
      <div class="stat-label">Transfers</div>
      <div class="stat-value" id="statTransfers">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📋</div>
      <div class="stat-label">Audit Logs</div>
      <div class="stat-value" id="statAudit">—</div>
    </div>
  </div>

  <!-- Cases -->
  <div class="section-header">
    <h2>Cases</h2>
    <button class="btn-new" onclick="openNewCaseModal()">+ New Case</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Case Number</th>
        <th>Title</th>
        <th>Status</th>
        <th>Created By</th>
        <th>Date</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="casesTable">
      <tr><td colspan="6" class="empty-state">Loading cases...</td></tr>
    </tbody>
  </table>
</main>

<!-- New Case Modal -->
<div class="modal-overlay" id="newCaseModal">
  <div class="modal">
    <h3>📁 Create New Case</h3>
    <div class="form-group">
      <label>Case Number</label>
      <input type="text" id="caseNumber" placeholder="e.g. CASE-2026-001"/>
    </div>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="caseTitle" placeholder="Brief case title"/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="caseDesc" rows="3" placeholder="Case details..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-submit" onclick="createCase()">Create Case</button>
    </div>
  </div>
</div>

<script>
  const API = 'https://evitrace-api.onrender.com';
  const token = localStorage.getItem('token');

  // Redirect to login if not authenticated
  if (!token) window.location.href = 'login.html';

  // Show user info in nav
  document.getElementById('userName').textContent = localStorage.getItem('userName') || 'User';
  document.getElementById('userRole').textContent = localStorage.getItem('userRole') || '';

  // Load everything on page load
  loadStats();
  loadCases();

  async function loadStats() {
    try {
      const res = await fetch(`${API}/api/dashboard/stats`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      document.getElementById('statCases').textContent     = data.totalCases;
      document.getElementById('statEvidence').textContent  = data.totalEvidence;
      document.getElementById('statTransfers').textContent = data.totalTransfers;
      document.getElementById('statAudit').textContent     = data.totalAuditLogs;
    } catch (e) {
      console.error('Stats error', e);
    }
  }

  async function loadCases() {
    try {
      const res = await fetch(`${API}/api/cases`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const cases = await res.json();
      const tbody = document.getElementById('casesTable');

      if (cases.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No cases yet. Create one above.</td></tr>`;
        return;
      }

      tbody.innerHTML = cases.map(c => `
        <tr>
          <td style="color:#6ee7b7; font-weight:600;">${c.caseNumber}</td>
          <td>${c.title}</td>
          <td><span class="badge badge-${c.status.toLowerCase()}">${c.status}</span></td>
          <td>${c.createdByName}</td>
          <td>${new Date(c.createdAt).toLocaleDateString()}</td>
          <td>
            <button class="btn-view"
              onclick="window.location.href='case-detail.html?id=${c.id}'">
              View →
            </button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      console.error('Cases error', e);
    }
  }

  function openNewCaseModal() {
    document.getElementById('newCaseModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('newCaseModal').classList.remove('active');
  }

  async function createCase() {
    const body = {
      caseNumber:  document.getElementById('caseNumber').value.trim(),
      title:       document.getElementById('caseTitle').value.trim(),
      description: document.getElementById('caseDesc').value.trim()
    };

    if (!body.caseNumber || !body.title) {
      alert('Case number and title are required.');
      return;
    }

    try {
      const res = await fetch(`${API}/api/cases`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        alert('Failed to create case.');
        return;
      }

      closeModal();
      loadCases();
      loadStats();
    } catch (e) {
      alert('Error connecting to server.');
    }
  }

  function logout() {
    localStorage.clear();
    window.location.href = 'login.html';
  }
</script>

</body>
</html>
