<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EviTrace — Case Detail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    nav {
      background: #1a1d27; border-bottom: 1px solid #2d3148;
      padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-size: 18px; font-weight: 700; color: #6ee7b7; letter-spacing: 2px; cursor: pointer; }
    .nav-user { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #94a3b8; }
    .nav-user span { color: #e2e8f0; font-weight: 600; }
    .btn-logout { background: transparent; border: 1px solid #2d3148; color: #94a3b8; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .btn-logout:hover { border-color: #ef4444; color: #ef4444; }

    main { padding: 32px; max-width: 1200px; margin: 0 auto; }

    .back-link { color: #64748b; font-size: 13px; cursor: pointer; margin-bottom: 24px; display: inline-block; }
    .back-link:hover { color: #6ee7b7; }

    .case-header {
      background: #1a1d27; border: 1px solid #2d3148; border-radius: 10px;
      padding: 24px 28px; margin-bottom: 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .case-header h1 { font-size: 20px; color: #6ee7b7; margin-bottom: 4px; }
    .case-header p { font-size: 13px; color: #64748b; }

    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-open     { background: #1e3a5f; color: #60a5fa; }
    .badge-active   { background: #1a3a2a; color: #6ee7b7; }
    .badge-closed   { background: #2d2d2d; color: #94a3b8; }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    h2 { font-size: 16px; font-weight: 600; }

    .btn-new { background: #6ee7b7; color: #0f1117; border: none; padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-new:hover { background: #34d399; }

    table { width: 100%; border-collapse: collapse; background: #1a1d27; border: 1px solid #2d3148; border-radius: 10px; overflow: hidden; }
    th { background: #12141f; padding: 12px 16px; text-align: left; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
    td { padding: 14px 16px; font-size: 13px; border-top: 1px solid #2d3148; }
    tr:hover td { background: #1e2235; }

    .hash { font-family: monospace; font-size: 11px; color: #64748b; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn-chain { background: transparent; border: 1px solid #2d3148; color: #94a3b8; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; }
    .btn-chain:hover { border-color: #6ee7b7; color: #6ee7b7; }

    .empty-state { text-align: center; padding: 48px; color: #64748b; font-size: 14px; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 32px; width: 500px; }
    .modal h3 { font-size: 16px; margin-bottom: 24px; color: #6ee7b7; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
    input, select, textarea { width: 100%; background: #0f1117; border: 1px solid #2d3148; border-radius: 6px; padding: 10px 14px; color: #e2e8f0; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: #6ee7b7; }
    select option { background: #1a1d27; }
    .modal-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
    .btn-cancel { background: transparent; border: 1px solid #2d3148; color: #94a3b8; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-submit { background: #6ee7b7; color: #0f1117; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; }

    .upload-area { border: 2px dashed #2d3148; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; color: #64748b; font-size: 13px; }
    .upload-area:hover { border-color: #6ee7b7; color: #6ee7b7; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="window.location.href='dashboard.html'">🔍 EVITRACE</div>
  <div class="nav-user">
    <span id="userName"></span>
    <span id="userRole" style="color:#6ee7b7; font-size:11px;"></span>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>
</nav>

<main>
  <div class="back-link" onclick="window.location.href='dashboard.html'">← Back to Dashboard</div>

  <div class="case-header" id="caseHeader">
    <div>
      <h1 id="caseNumber">Loading...</h1>
      <p id="caseTitle"></p>
      <p id="caseDesc" style="margin-top:6px; color:#94a3b8;"></p>
    </div>
    <span class="badge" id="caseStatus"></span>
  </div>

  <div class="section-header">
    <h2>Evidence Items</h2>
    <button class="btn-new" onclick="openUploadModal()">+ Upload Evidence</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Type</th>
        <th>Status</th>
        <th>Collected By</th>
        <th>SHA-256 Hash</th>
        <th>Date</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="evidenceTable">
      <tr><td colspan="7" class="empty-state">Loading evidence...</td></tr>
    </tbody>
  </table>
</main>

<!-- Upload Evidence Modal -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <h3>🔬 Upload Evidence</h3>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="evTitle" placeholder="Evidence title"/>
    </div>
    <div class="form-group">
      <label>Type</label>
      <select id="evType">
        <option value="DIGITAL">Digital</option>
        <option value="PHYSICAL">Physical</option>
        <option value="DOCUMENT">Document</option>
        <option value="BIOLOGICAL">Biological</option>
        <option value="AUDIO_VIDEO">Audio/Video</option>
      </select>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="evDesc" rows="2" placeholder="Optional description..."></textarea>
    </div>
    <div class="form-group">
      <label>File</label>
      <div class="upload-area" onclick="document.getElementById('evFile').click()">
        <span id="fileLabel">Click to choose file</span>
        <input type="file" id="evFile" style="display:none" onchange="updateFileLabel()"/>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-submit" onclick="uploadEvidence()">Upload</button>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:8080';
  const token = localStorage.getItem('token');
  if (!token) window.location.href = 'login.html';

  document.getElementById('userName').textContent = localStorage.getItem('userName') || '';
  document.getElementById('userRole').textContent = localStorage.getItem('userRole') || '';

  // Get case ID from URL: case-detail.html?id=1
  const params = new URLSearchParams(window.location.search);
  const caseId = params.get('id');
  if (!caseId) window.location.href = 'dashboard.html';

  loadCase();
  loadEvidence();

  async function loadCase() {
    try {
      const res = await fetch(`${API}/api/cases`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const cases = await res.json();
      const c = cases.find(x => x.id == caseId);
      if (!c) return;

      document.getElementById('caseNumber').textContent = c.caseNumber;
      document.getElementById('caseTitle').textContent  = c.title;
      document.getElementById('caseDesc').textContent   = c.description || '';

      const statusEl = document.getElementById('caseStatus');
      statusEl.textContent = c.status;
      statusEl.className = `badge badge-${c.status.toLowerCase()}`;
    } catch(e) { console.error(e); }
  }

  async function loadEvidence() {
    try {
      const res = await fetch(`${API}/api/evidence/case/${caseId}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const items = await res.json();
      const tbody = document.getElementById('evidenceTable');

      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No evidence uploaded yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(e => `
        <tr>
          <td style="font-weight:600;">${e.title}</td>
          <td style="color:#94a3b8;">${e.type}</td>
          <td><span class="badge badge-open">${e.status}</span></td>
          <td>${e.collectedByName}</td>
          <td class="hash" title="${e.fileHash}">${e.fileHash}</td>
          <td>${new Date(e.collectedAt).toLocaleDateString()}</td>
          <td>
            <button class="btn-chain"
              onclick="window.location.href='custody-chain.html?id=${e.id}'">
              Chain →
            </button>
          </td>
        </tr>
      `).join('');
    } catch(e) { console.error(e); }
  }

  function openUploadModal() {
    document.getElementById('uploadModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('uploadModal').classList.remove('active');
  }

  function updateFileLabel() {
    const file = document.getElementById('evFile').files[0];
    document.getElementById('fileLabel').textContent = file ? file.name : 'Click to choose file';
  }

  async function uploadEvidence() {
    const title = document.getElementById('evTitle').value.trim();
    const type  = document.getElementById('evType').value;
    const desc  = document.getElementById('evDesc').value.trim();
    const file  = document.getElementById('evFile').files[0];

    if (!title || !file) { alert('Title and file are required.'); return; }

    const formData = new FormData();
    formData.append('caseId', caseId);
    formData.append('title', title);
    formData.append('type', type);
    formData.append('description', desc);
    formData.append('file', file);

    try {
      const res = await fetch(`${API}/api/evidence`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: formData
      });

      if (!res.ok) { alert('Upload failed.'); return; }

      closeModal();
      loadEvidence();
    } catch(e) { alert('Error connecting to server.'); }
  }

  function logout() {
    localStorage.clear();
    window.location.href = 'login.html';
  }
</script>

</body>
</html>
