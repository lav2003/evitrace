# ===== Server =====
server.port=8080

# ===== Database (MySQL) =====
# Create the database first: CREATE DATABASE evitrace;
spring.datasource.url=jdbc:mysql://localhost:3306/evitrace?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=2916.lav
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# 'update' = Hibernate creates/alters tables to match your entities automatically.
# Good for learning/dev. In real production you'd use migration tools (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# This secret signs your tokens. Change it, and NEVER commit a real one to GitHub.
app.jwt.secret=change-this-to-a-long-random-secret-string-min-32-chars
app.jwt.expiration-ms=86400000

# ===== File storage =====
app.file.upload-dir=./uploads
