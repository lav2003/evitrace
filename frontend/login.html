<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EviTrace — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .logo h1 {
      font-size: 24px;
      font-weight: 700;
      color: #6ee7b7;
      letter-spacing: 2px;
    }

    .logo p {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 12px 16px;
      color: #e2e8f0;
      font-size: 14px;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus {
      border-color: #6ee7b7;
    }

    .btn-login {
      width: 100%;
      background: #6ee7b7;
      color: #0f1117;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-login:hover {
      background: #34d399;
    }

    .error-msg {
      background: #3b1a1a;
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .badge {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: #334155;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo">
    <div class="logo-icon">🔍</div>
    <h1>EVITRACE</h1>
    <p>Digital Evidence Management System</p>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="officer@agency.gov" />
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" />
  </div>

  <button class="btn-login" onclick="login()">Sign In</button>

  <div class="badge">🔒 Secured • All access is logged and monitored</div>
</div>

<script>
  const API = 'https://evitrace-api.onrender.com';

  // If already logged in, go straight to dashboard
  if (localStorage.getItem('token')) {
    window.location.href = 'dashboard.html';
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    errorMsg.style.display = 'none';

    if (!email || !password) {
      showError('Please enter your email and password.');
      return;
    }

    try {
      const res = await fetch(`${API}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      if (!res.ok) {
        showError('Invalid credentials. Please try again.');
        return;
      }

      const data = await res.json();

      // Store token and user info in localStorage
      localStorage.setItem('token', data.token);
      localStorage.setItem('userName', data.name);
      localStorage.setItem('userEmail', data.email);
      localStorage.setItem('userRole', data.role);

      // Redirect to dashboard
      window.location.href = 'dashboard.html';

    } catch (err) {
      showError('Cannot connect to server. Make sure the backend is running.');
    }
  }

  function showError(msg) {
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  // Allow pressing Enter to login
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
</script>

</body>
</html>
